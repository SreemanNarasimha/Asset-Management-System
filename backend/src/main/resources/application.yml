spring:
  datasource:
    url: ${MYSQL_URL:${DB_URL:jdbc:mysql://localhost:3306/mams?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
    username: ${MYSQL_USER:${MYSQLUSER:${DB_USER:root}}}
    password: ${MYSQL_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair: true
    locations: classpath:db/migration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://military-ams.vercel.app,https://military-b10luj2mw-sreeman-narasimhas-projects.vercel.app}
